<style>
  html, body { margin: 0; }
  html { scroll-behavior: smooth; }
  img { max-width: 100%; }

  /* Dual-thumb salary slider — thumbs need pointer-events: auto to grab,
     while the input track is invisible (background painted by parent). */
  .ym-range {
    -webkit-appearance: none;
    appearance: none;
  }
  .ym-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    pointer-events: auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 2.5px solid var(--orange);
    box-shadow: var(--shadow);
    cursor: grab;
  }
  .ym-range::-moz-range-thumb {
    pointer-events: auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 2.5px solid var(--orange);
    box-shadow: var(--shadow);
    cursor: grab;
  }
  .ym-range::-webkit-slider-runnable-track {
    background: transparent;
    height: 32px;
  }
  .ym-range::-moz-range-track {
    background: transparent;
    height: 32px;
  }
</style>
</head>
